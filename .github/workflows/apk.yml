name: Android app

# Builds the APK and, for a tagged version, publishes it so anyone can install
# it without a toolchain. Runs on demand as well, because "download the latest
# build" should not require cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to produce"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write        # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest

    # Hoisted to the job because a step's `if` cannot read secrets, nor the
    # step's own env. A job-level env can read them, and steps can read that.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # The APK carries the dashboard inside it, and the built dashboard is not
      # in the repository, so it is built here. That is deliberate: an APK is
      # then never shipped with a viewer older than the code beside it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle it into the app
        run: |
          rm -rf android-companion/app/src/main/assets/www
          cp -r frontend/dist android-companion/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # A signing key is only present if the repository has been given one.
      # Without it a tag still produces an installable debug build rather than
      # an unsigned release nobody can install.
      - name: Decode the signing key
        id: signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Decide the variant
        id: variant
        run: |
          # A tag with a key produces a signed release; anything else, a debug
          # build, which installs immediately and is the point of the artifact.
          if [ -n "${{ steps.signing.outputs.path }}" ] \
             && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=release" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.variant || 'debug' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect it
        id: apk
        run: |
          FOUND=$(find android-companion/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$FOUND" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          case "$FOUND" in
            *unsigned*)
              echo "The release build is unsigned; Android will not install it." >&2
              echo "Add the ANDROID_KEYSTORE_* secrets, or build the debug variant." >&2
              exit 1
              ;;
          esac
          cp "$FOUND" performance.apk
          echo "path=performance.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: performance-apk-${{ steps.variant.outputs.name }}
          path: performance.apk
          # Long enough to be useful, short enough not to hoard binaries.
          retention-days: 30

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: performance.apk
          # The version being tagged is the one people install, so the notes
          # say what it is rather than leaving the tag to speak for itself.
          body: |
            Android companion app for Performance ${{ github.ref_name }}.

            Install it on the phone, then point it at your server under
            **Settings → Server address**. The dashboard is bundled inside, so
            the app works as a viewer as well as a sync client.

            Built from ${{ github.sha }}.
