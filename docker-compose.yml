version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: performance-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=Performance
      - DATA_DIR=/data
      - DATABASE_URL=sqlite:////db/peakpace.db
      # Empty leaves sync open, which is fine on an isolated home network.
      # Set this to any value to require it, and enter the same value in the
      # phone app under "API Sync Token".
      - API_AUTH_TOKEN=
      # Terrain tiles used to recover elevation for devices that record none.
      # Place SRTM .hgt / .hgt.zip files here; run backend/dem_tiles.py to see
      # which tiles your routes need. Leave the directory empty to disable.
      - DEM_DIR=/data/dem
    volumes:
      - peakpace_db:/db
      - /opt/peakpace/data:/data
    ports:
      - "8000:8000"

  # Hourly database backup. Declared here rather than run as a stray
  # container so it is visible, versioned and restarted with the stack.
  # Reuses the backend image; the script itself lives on the mounted data
  # volume, so changing it needs no rebuild.
  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: performance-backup
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - DATABASE_URL=sqlite:////db/peakpace.db
      - BACKUP_DIR=/data/backups
      - BACKUP_INTERVAL_SEC=3600
      - MAX_BACKUPS=30
    volumes:
      - peakpace_db:/db
      - /opt/peakpace/data:/data
    entrypoint: ["python", "/data/backup.py", "--loop"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: performance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  # Deliberately still named peakpace_db: renaming a volume does not move the
  # data into it, so the stack would come up against an empty database. The
  # name is internal and never shown.
  peakpace_db:
    driver: local
