version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: performance-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=Performance
      - DATA_DIR=/data
      - DATABASE_URL=sqlite:////db/peakpace.db
      # Empty leaves sync open, which is fine on an isolated home network.
      # Set this to any value to require it, and enter the same value in the
      # phone app under "API Sync Token".
      - API_AUTH_TOKEN=
      # Terrain tiles used to recover elevation for devices that record none.
      # Place SRTM .hgt / .hgt.zip files here; run backend/dem_tiles.py to see
      # which tiles your routes need. Leave the directory empty to disable.
      - DEM_DIR=/data/dem
      - CONNECTION_TOKEN_DIR=/data/connections
    volumes:
      - peakpace_db:/db
      - /opt/peakpace/data:/data
    ports:
      - "8000:8000"

  # Scheduled work: database backups, and polling linked watch accounts for
  # athletes who have no Health Connect. Reuses the backend image; the script
  # lives on the mounted data volume, so changing it needs no rebuild.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: performance-scheduler
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - DATABASE_URL=sqlite:////db/peakpace.db
      - BACKUP_DIR=/data/backups
      # Daily. The database changes a few times a week, not hourly.
      - BACKUP_INTERVAL_SEC=86400
      # Age-based, not count-based: a week of history is what is actually
      # wanted, and a count means something different whenever the schedule does.
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_KEEP_MINIMUM=3
      # How often linked Garmin accounts are checked for new activities.
      - CONNECTION_POLL_SEC=1800
      - CONNECTION_TOKEN_DIR=/data/connections
    volumes:
      - peakpace_db:/db
      - /opt/peakpace/data:/data
    entrypoint: ["python", "/data/scheduler.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: performance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  # Deliberately still named peakpace_db: renaming a volume does not move the
  # data into it, so the stack would come up against an empty database. The
  # name is internal and never shown.
  peakpace_db:
    driver: local
